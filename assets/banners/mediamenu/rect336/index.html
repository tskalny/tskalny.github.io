<!DOCTYPE html>

<html>

<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />

<meta name="ad.size" content="width=336,height=280">
<script type="text/javascript">
    var clickTag = "#";
</script>

<title>Banner</title>

<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>

<style type="text/css">

html{align-items:center; display:flex; height:100%; width:100%; }

body{margin:0; padding:0; margin-left:auto; margin-right:auto;}



.main-container{

	position: relative;

	width: 336px;

	height: 280px;

	overflow: hidden;

	background-color: #fffff;

	cursor: pointer;

	opacity: 0;

}



.img{

	position: absolute;

	left: 0px;

	top: 0px;

	width: 100%;

	height: 100%;

	-ms-transform: rotate(0.01deg); /* IE 9 */

    -webkit-transform: rotate(0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(0.01deg);

    background-repeat: no-repeat;

    background-size: contain;

}



.img img{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

	-ms-transform: rotate(-0.01deg); /* IE 9 */

    -webkit-transform: rotate(-0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(-0.01deg);

     backface-visibility: hidden;

	-webkit-transform-style: preserve-3d;

	-moz-transform-style: preserve-3d;

	-ms-transform-style: preserve-3d;

	-o-transform-style: preserve-3d;

	transform-style: preserve-3d;

    image-rendering: -webkit-optimize-contrast;

    image-rendering: -webkit-crisp-edges;

    will-change:transform;

}



.border{

	position: absolute;

	width: 100%;

	height: 100%;

	border: 1px solid #cccccc;

	-webkit-box-sizing: border-box;

	-moz-box-sizing: border-box;

	box-sizing: border-box;

}



.pl{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

}



</style>

</head>

<body>

<a href="javascript:window.open(window.clickTag)">

<div class="main-container" id="banner">
	<div class="img bg"><img src="bg.jpg"></div>
	<div class="img pl"><img src="pl.png"></div>
	<div class="img icon1"><img src="icon1.png"></div>
	<div class="img icon2"><img src="icon2.png"></div>
	<div class="img icon3"><img src="icon3.png"></div>
  <div class="img icon4"><img src="icon4.png"></div>

  
  
<div class="img logo"><img src="logo.png"></div>
<div class="img t"><img src="t.png"></div>

<div class="img bt"><img src="bt.png"></div>


<div class="border"></div>

</div>
</a>



<script>

gsap.set(".main-container", {autoAlpha:1});

var bannerWidth = document.querySelector("#banner").offsetWidth;

var bannerHeight = document.querySelector("#banner").offsetHeight;

var loops = 1;

gsap.set(".bt", { transformOrigin:"160px 144px"});



var tl=new TimelineMax({repeat:1,delay:0,onComplete:function(){this.tweenFromTo("start","end")}});



tl .addLabel("start")




.from(".logo", 1.5, { transformOrigin:"180px 124px", ease:'Back.easeOut.config(1.7)'},0.0)
.from(".t1", 0.5, {x:"-5%",stagger:0.2, autoAlpha:0, ease:Power2.easeOut},0.3)
.from(".icon1, .icon2, .icon3, .icon4", 0.5, {x:"-5%",stagger:0.2, autoAlpha:0, ease:Power2.easeOut},0.3)

.to(".bg1", 0.5, {autoAlpha:0, ease:Power2.easeOut},4.0)

.from(".bt", 0.5, {y:"-5%", autoAlpha:0, ease:Power2.easeOut},4.3).addLabel("end")


.to(".icon1, .icon2, .icon3, .icon4", 0.5, {scale:0.8, y:-15, stagger:0.3, ease:Power2.easeOut},3.0)



.to(".bt, .t1, .t2", 0.5, {x:"2%", autoAlpha:0, ease:Power2.inOut},10.0)

</script>

</body>

</html>
