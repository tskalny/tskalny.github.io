<!DOCTYPE html>

<html>

<head>

<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />
<meta name="ad.orientation" content="landscape">
<meta name="ad.size" content="width=480,height=320">
<script type="text/javascript">
    var clickTag = "#";
</script>

<title>Banner</title>

<script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.5.1_min.js"></script>

<style type="text/css">

html{align-items:center; display:flex; height:100%; width:100%; }

body{margin:0; padding:0; margin-left:auto; margin-right:auto;}



.main-container{

	position: relative;

	width: 480px;

	height: 320px;

	overflow: hidden;

	background-color: #c3e8fa;

	cursor: pointer;

	opacity: 0;

}



.img{

	position: absolute;

	left: 0px;

	top: 0px;

	width: 100%;

	height: 100%;

	-ms-transform: rotate(0.01deg); /* IE 9 */

    -webkit-transform: rotate(0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(0.01deg);

    background-repeat: no-repeat;

    background-size: contain;

}



.img img{

	position: absolute;

	left: 0px;

	top: 0px;

	height: 100%;

	-ms-transform: rotate(-0.01deg); /* IE 9 */

    -webkit-transform: rotate(-0.01deg); /* Chrome, Safari, Opera */

    transform: rotate(-0.01deg);

     backface-visibility: hidden;

	-webkit-transform-style: preserve-3d;

	-moz-transform-style: preserve-3d;

	-ms-transform-style: preserve-3d;

	-o-transform-style: preserve-3d;

	transform-style: preserve-3d;

    image-rendering: -webkit-optimize-contrast;

    image-rendering: -webkit-crisp-edges;

    will-change:transform;

}



.border{

	position: absolute;

	width: 100%;

	height: 100%;

	border: 1px solid #cccccc;

	-webkit-box-sizing: border-box;

	-moz-box-sizing: border-box;

	box-sizing: border-box;

}



</style>

</head>

<body>

<a href="javascript:window.open(window.clickTag)">

<div class="main-container" id="banner">

<div class="img hand"><img src="hand.png"></div>


	<div class="img logo"><img src="logo.png"></div>
	<div class="img t1"><img src="t1.png"></div>

	<div class="img t2"><img src="t2.png"></div>
  <div class="img bg2"><img src="bg2.png"></div>
  <div class="img t3"><img src="t3.png"></div>
  <div class="img bg3"><img src="bg3.png"></div>
<div class="img card"><img src="card.png"></div>
  <div class="img bg4"><img src="bg4.png"></div>










<div class="border"></div>

</div>
</a>



<script>

gsap.set(".main-container", {autoAlpha:1});

var bannerWidth = document.querySelector("#banner").offsetWidth;

var bannerHeight = document.querySelector("#banner").offsetHeight;

var loops = 1;

gsap.set(".hand", { transformOrigin:"20px 320px"});



var tl=new TimelineMax({repeat:1,delay:0,onComplete:function(){this.tweenFromTo("start","end")}});



tl .addLabel("start")

.from(".hand", 1.5, {rotate:30, y:"100%", ease:Back.easeOut.config(0)},0.0)
.from(".t1", 0.5, {y:"-10%", autoAlpha:0, ease:Power2.easeOut},0.5)
.to(".t1", 0.5, {y:"10%", autoAlpha:0, ease:Power2.easeOut},1.8)

.from(".t2", 0.5, {y:"-10%", autoAlpha:0, ease:Power2.easeOut},2.0)
.from(".bg2", 0.3, { autoAlpha:0, ease:Power2.easeOut},2.0)
.to(".t2", 0.5, {y:"10%", autoAlpha:0, ease:Power2.easeOut},3.5)
.to(".bg2", 0.3, { autoAlpha:0, ease:Power2.easeOut},4.0)


.from(".bg3", 0.3, { autoAlpha:0, ease:Power2.easeOut},4.0)
.from(".card", 1.5, {rotate:30, y:"-100%", ease:Power2.easeOut},4.0)
.to(".card", 1.5, {rotate:40, y:"-100%", ease:Back.easeOut},6.0)
.to(".t3", 0.5, {y:"-10%", autoAlpha:0, ease:Power2.easeOut},5.5)
.to(".bg3", 0.3, { autoAlpha:0, ease:Power2.easeOut},6.5)

.from(".logo", 1.5, {rotate:10, y:"100%", ease:Power2.easeOut},6.0)
.from(".t3", 0.5, {y:"10%", autoAlpha:0, ease:Power2.easeOut},6.4)
.from(".bg4", 0.3, { autoAlpha:0, ease:Power2.easeOut},6.4)
.to(".bg4", 0.3, { autoAlpha:0, ease:Power2.easeOut},9.4)

.addLabel("end")


.to(" .t3, .logo, .hand", 0.5, { autoAlpha:0, ease:Power2.inOut},11.0)

</script>

</body>

</html>
